seed: 42
paths:
  raw_dir: data/raw/cropandweed
  processed_dir: data/processed
  models_dir: models
  outputs_dir: outputs

data:
  variant: CropOrWeed2
  split:
    train: 0.70
    val: 0.15
    test: 0.15
    group_by: session
  subset_fraction: 0.02
  max_samples: 20

model:
  name: fasterrcnn_mobilenet_v3_large_fpn
  num_classes: 3
  min_size: 320
  max_size: 480
  pretrained: true

train:
  epochs: 1
  batch_size: 2
  optimizer: sgd
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  warmup_iters: 5
  scheduler: cosine
  freeze_backbone_epochs: 0
  early_stopping_patience: 1
  num_workers: 0

eval:
  iou_threshold: 0.5
  score_threshold: 0.5

inference:
  score_threshold: 0.5
  nms_iou: 0.5
